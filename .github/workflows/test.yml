name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: server (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        # ubuntu-latest (Ubuntu 26.04) has no Python 3.9 build; 3.9 runs on the previous LTS.
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -I -B -m unittest discover -s tests -v

  browser:
    name: browser end to end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -I -B tests/e2e_browser.py

  plugin:
    name: plugin (claude plugin validate + test, claude-code ${{ matrix.channel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, latest]
    env:
      DISABLE_AUTOUPDATER: "1" # the stable leg must not update itself to latest before the tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm install -g --no-fund --no-audit @anthropic-ai/claude-code@${{ matrix.channel }}
      - run: claude --version
      - run: claude plugin validate plugin
      - run: claude plugin validate .claude-plugin/marketplace.json
      - run: python3 -I -B tests/mod_test.py

  app:
    name: app (go vet + test, build.sh, macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # TestRealInbox runs plugin/bin/signoff, which runs python3.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # The cask builds with Homebrew's current go. No cache: a clean build each time, as on the user's Mac.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false
      - run: go vet ./...
      - run: go test -count=1 ./...
      # As the cask runs it: vet and test build without -tags production.
      - run: SIGNOFF_LAUNCHER=link sh build.sh
