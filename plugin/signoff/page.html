<body>
<header>
  <div class="head-text"><p class="project" id="project-line" hidden><span id="project"></span><time id="opened" hidden></time><span class="pill old" id="old-round" hidden></span></p><h1 id="title"></h1><p class="intro head-intro" id="intro"></p></div>
  <div class="actions"><span id="status" role="status" aria-live="polite">Not saved yet</span>
    <button type="button" id="accept-all"><span class="accept"><span id="accept-short">Accept all</span><span class="wide" id="accept-rest"> recommendations</span></span><span class="undo" hidden>Undo accept all</span></button>
    <span class="progress" id="progress" hidden></span>
    <button type="button" class="primary" id="done" aria-describedby="done-reason">Done</button>
    <button type="button" class="icon" id="appearance-open" aria-haspopup="dialog" aria-label="Appearance"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M18.4 2.8a2 2 0 0 1 2.8 2.8L12.4 14.4l-2.8-2.8z"/><path d="M8.2 13.2c-2 0-3.6 1.5-3.6 3.5 0 1.4-.8 2.4-2.1 2.9 1 .9 2.5 1.4 3.9 1.4 2.7 0 4.8-2 4.8-4.8z"/></svg></button></div>
  <button type="button" class="link reason" id="done-reason" hidden></button>
</header>
<p class="notice" id="notice" role="note" hidden></p>
<main>
  <div class="tabs" id="tabs" role="tablist" hidden></div>
  <p class="intro page-intro" id="intro-phone"></p>
  <p class="banner" id="banner" role="alert"></p>
  <div class="layout" id="layout">
    <div class="history" id="history" hidden>
      <div class="filters">
        <label><span id="h-text-label">Search</span><input type="search" id="h-text"></label>
        <label><span id="h-from-label">From</span><input type="text" id="h-from" inputmode="numeric" maxlength="10" placeholder="YYYY-MM-DD" autocomplete="off"></label>
      </div>
      <p class="h-count" id="h-count" role="status"></p>
      <ul class="h-list" id="h-list"></ul>
    </div>
    <div id="panels"></div>
  </div>
</main>
<dialog id="help" aria-labelledby="help-title">
  <h2 id="help-title">Keyboard shortcuts</h2>
  <dl class="keys" id="help-keys"></dl>
  <button type="button" id="help-close">Close</button>
</dialog>
<dialog id="appearance" aria-labelledby="ap-title">
  <h2><span id="ap-title">Appearance</span> <kbd id="ap-key"></kbd></h2>
  <span class="ap-lab" id="ap-mode-label">Mode</span>
  <div class="seg ap-modes" id="ap-modes" role="radiogroup" aria-labelledby="ap-mode-label"></div>
  <span class="ap-lab" id="ap-density-label">Density</span>
  <div class="seg ap-modes" id="ap-density" role="radiogroup" aria-labelledby="ap-density-label"></div>
  <span class="ap-lab" id="ap-palette-label">Palette</span>
  <ul class="plist" id="ap-palettes" role="listbox" aria-labelledby="ap-palette-label"></ul>
  <p class="ap-note" id="ap-note" role="status"></p>
  <div class="ap-foot"><span id="ap-keys"></span>
    <span class="ap-btns"><button type="button" id="ap-cancel">Cancel</button><button type="button" class="primary" id="ap-keep">Keep</button></span></div>
</dialog>
<script type="application/json" id="signoff-data">__DATA__</script>
<script nonce="__NONCE__">
__PART:page-common.js__
__PART:page-inbox.js__
__PART:page-items.js__
__PART:page-rounds.js__
</script>
</body>
</html>
