<style nonce="__NONCE__">

.ap-note{margin:10px 0 0;font-size:12.5px;color:var(--soft)}

.intro{font-size:13.5px}
.head-intro{padding-left:32px}
.project{margin:0 0 2px;padding-left:32px;font-size:12.5px;font-weight:650;line-height:1.3;color:var(--accent)}
button{border-radius:7px;padding:7px 14px;border-color:var(--line2);box-shadow:var(--shadow)}
button.primary{background:var(--btn);border-color:var(--btn);color:var(--btntext);font-weight:600}
button.primary[aria-disabled=true]{opacity:1;background:var(--btnoff);border-color:var(--btnoff);color:var(--btnofftext);box-shadow:none}
button.link{box-shadow:none}
.progress{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--soft);background:var(--hover);
  border-radius:999px;padding:3px 10px}
.progress::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.notice{border-radius:8px;border:1px solid var(--line);border-left:3px solid var(--box);background:var(--boxsoft);font-weight:550;
  font-size:13.5px;padding:8px 12px}
h2.group{display:flex;align-items:center;gap:10px;font-size:11.5px;font-weight:650;letter-spacing:.09em;margin:26px 0 6px}
h2.group::after{content:"";flex:1;height:1px;background:var(--line)}
.item{border-radius:12px;padding:18px;margin:10px 0;box-shadow:var(--shadow)}
.frame,.board-box{border-radius:8px;border-color:var(--line2)}
h3{font-size:16px;font-weight:650;letter-spacing:-.01em}
.num{display:inline-block;font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--accent);background:var(--sel);
  border-radius:5px;padding:4px 6px;margin-right:8px;vertical-align:2px}
.desc{font-size:14px}
.cost{display:flex;gap:8px;align-items:baseline;font-size:13px}
.cost strong{flex:0 0 auto;white-space:nowrap;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--quiet)}
.rec{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--sel);color:var(--accent);font-size:12px;font-weight:650;
  letter-spacing:0;padding:3px 10px 3px 8px}
.rec::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.choices{gap:6px}
.opt input{top:12px;width:16px;height:16px}
.opt label{border-radius:8px;padding:8px 12px 8px 40px;min-height:40px;font-size:14px;background:var(--panel)}
.opt input:checked+label{border-color:var(--accent);background:var(--sel);box-shadow:inset 0 0 0 1px var(--accent);font-weight:600}
.opt .detail{font-size:13px}
.opt input.other-text{margin-left:40px;width:calc(100% - 40px);border-radius:7px}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--btntext);background:var(--accent);
  border-radius:4px;padding:1px 5px;vertical-align:1px}
textarea{border-radius:7px;border-color:var(--line2)}
.clabel{font-size:12.5px;font-weight:600;color:var(--quiet)}
.ftitle{font-size:15px}
.accept-state.changed,.st-error,.h-warn{color:var(--boxtext)}
.readonly-note{border-radius:8px;font-size:13.5px}
.summary-round h2{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:650}
.summary-round h2::after{content:"";flex:1;height:1px;background:var(--line)}
.summary-list{gap:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.summary-list li{border:0;border-radius:0;padding:10px 14px}
.summary-list li:not([hidden])~li{border-top:1px solid var(--line)}
.summary-filter{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin:16px 0 0}
.summary-filter .seg{max-width:100%}
.summary-filter .seg button{flex:0 1 auto;overflow-wrap:normal}
.summary-note{margin:6px 0 2px;padding:1px 0 1px 10px;border-left:2px solid var(--accent);color:var(--text);font-size:13.5px;
  white-space:pre-line;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.summary-note.open{display:block;overflow:visible}
.note-more{display:block;font-size:13px}
.summary-block{margin:28px 0 0}
.summary-list li.flag{border-left:0;box-shadow:inset 3px 0 0 var(--box)}
.summary-list .link{font-weight:600;text-align:left}
.badge{border:0;background:var(--hover);color:var(--soft);font-size:11.5px;padding:2px 8px}
.crow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px;margin:14px 0 4px}
.crow .clabel{margin:0}
.lock-label{display:inline-flex;align-items:center;gap:6px;margin-left:auto;font-size:12.5px;color:var(--soft);cursor:pointer}
.lock-label input{margin:0;width:14px;height:14px;accent-color:var(--accent)}
/* a padlock drawn in CSS: body and shackle (img-src 'self' rules out a data: URI) */
.lock-label::before,.sens::before,.badge.private::before{content:"";display:inline-block;flex:0 0 auto;width:9px;height:11px;
  margin-right:4px;vertical-align:-1px;background:linear-gradient(currentColor,currentColor) 0 5px/9px 6px no-repeat,
  radial-gradient(circle at 4.5px 5px,transparent 2px,currentColor 2.2px 3.5px,transparent 3.7px) 0 0/9px 5px no-repeat}
.lock-label::before{margin-right:0}
.sens{margin:14px 0 0;padding:7px 10px;border-radius:8px;background:var(--hover);border:1px solid var(--line2);
  border-left:3px solid var(--quiet);font-size:12.5px;color:var(--soft)}
.sens strong{color:var(--text);font-weight:650}
textarea.private{border-style:dashed}
.lock-note{font-size:12px;color:var(--quiet);margin:4px 0 0}
.summary-private{margin:6px 0 2px;padding:1px 0 1px 10px;border-left:2px solid var(--line2);color:var(--quiet);font-style:italic;
  font-size:13.5px}
/* ---- criteria: facts as chips on the cards, and the table view (rows = criteria, columns = options) ---- */
.view-bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:0 0 10px}
.facts{display:flex;flex-wrap:wrap;gap:4px 6px;margin:6px 0 0;font-weight:400}
.fact{font-size:12px;font-weight:500;border-radius:6px;padding:1px 7px;background:var(--hover);color:var(--soft)}
.fact b{font-weight:700;color:var(--quiet);margin-right:4px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.fact.good{background:var(--oksoft);color:var(--ok)}
.fact.bad{background:var(--boxsoft);color:var(--boxtext)}
.glyph{font-size:10px;font-weight:700;margin-right:4px}
.cmp-wrap{position:relative;overflow-x:auto;border:1px solid var(--line2);border-radius:8px;background:var(--panel)}
table.cmp{border-collapse:collapse;width:100%;font-size:13.5px}
.cmp th,.cmp td{text-align:left;vertical-align:top;padding:8px 12px;border-top:1px solid var(--line)}
.cmp thead th{border-top:0;background:var(--field);min-width:170px}
.cmp th[scope=row],.cmp thead th:first-child{position:sticky;left:0;min-width:120px;background:var(--field)}
.cmp th[scope=row]{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--quiet)}
.cmp .picked{background:var(--sel)}
.cmp thead th.picked{box-shadow:inset 0 3px 0 var(--accent)}
.cmp td{cursor:pointer}
.cmp .pick{display:flex;gap:10px;align-items:flex-start;font-weight:600;cursor:pointer}
.cmp .pick input{margin:3px 0 0;width:16px;height:16px;accent-color:var(--accent);flex:0 0 auto}
.cmp .sub{display:block;font-weight:400;color:var(--quiet);font-size:12.5px}
.cmp .tone.good{color:var(--ok)}
.cmp .tone.bad{color:var(--boxtext)}
.scroll-hint{font-size:12.5px;color:var(--quiet);margin:6px 0 0}
.legend-line{font-size:12.5px;color:var(--quiet);margin:8px 0 0}
@media (max-width:600px){
  table.cmp{width:max-content}
  .cmp thead th,.cmp td{width:160px;min-width:160px;max-width:160px;padding:8px 10px}
  .cmp th[scope=row],.cmp thead th:first-child{width:108px;min-width:108px;max-width:108px;padding:8px;font-size:12px;
    letter-spacing:0;text-transform:none;overflow-wrap:normal}}
dialog{border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
kbd{border-radius:4px}
@media (prefers-reduced-motion:no-preference){
  button,.opt label{transition:background-color .15s,border-color .15s,box-shadow .15s,color .15s}}
@media (hover:hover){.opt label:hover{border-color:var(--line2)}.opt input:checked+label:hover{border-color:var(--accent)}}
@media (max-width:600px){
  header{padding:8px 16px}
  h1{font-size:16px}
  .actions{gap:8px;width:100%}
  #status{order:3;flex:1 0 100%;font-size:12px}
  .actions button{padding:6px 12px;font-size:14px}
  .reason{font-size:12.5px}
  .item{padding:14px;border-radius:10px}}
/* ---- the inbox: what waits on you in every project, then each project's todo items ---- */
.back{display:inline-block;margin:0 0 2px 32px;font-size:12.5px;font-weight:600;color:var(--accent);text-decoration:none}
.back:hover{text-decoration:underline}
/* Sally's boards: a sidebar, the toolbar (the page's own header), the main area and a key bar, the same on the inbox
   and on a round's page. Under 1000 px the sidebar is a drawer; under 760 px the inbox's item opens as a bottom sheet. */
body.app{display:grid;grid-template-columns:240px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"side head" "side main" "side foot";height:100vh;height:100dvh;padding:0;overflow:hidden;font-size:14px}
body.app.side-off,body.app.focusing{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "main" "foot"}
body.app.side-off>.side,body.app.focusing>.side{display:none}
body.app>header{grid-area:head;position:static;margin:0;min-height:52px;padding:8px 16px;flex-wrap:nowrap;gap:12px}
body.app .head-text{flex:1 1 auto}
body.app h1{font-size:15px;font-weight:700;line-height:1.2}
body.app h1::before{display:none}
body.app .head-intro{display:block;padding:0;margin:1px 0 0;font-size:12px;color:var(--quiet)}
body.app .actions{flex-wrap:nowrap;gap:8px;width:auto}
body.app>main{grid-area:main;max-width:none;margin:0;min-height:0;min-width:0}
body.inbox #layout{display:grid;grid-template-columns:minmax(330px,420px) minmax(0,1fr);height:100%;min-height:0}
body.inbox #panels{overflow:auto;border-right:1px solid var(--line);padding:4px 0 24px;min-height:0;overscroll-behavior:contain}
body.inbox.focusing #panels{display:none}
body.inbox.focusing #layout{grid-template-columns:minmax(0,1fr)}
body.app header button.icon{border-color:transparent;background:transparent;box-shadow:none}
@media (hover:hover){body.app header button.icon:hover{background:var(--hover)}}
.tb-btn{padding:5px 10px;font-size:13px}
.tb-btn[aria-pressed=true]{background:var(--sel);border-color:var(--accent);font-weight:600}
.tb-btn kbd{margin-left:6px;font-size:11px;padding:0 4px}
button.icon svg,.side .ic{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.side{grid-area:side;background:var(--chrome);border-right:1px solid var(--line);padding:14px 10px;overflow:auto;min-height:0}
.brand{display:flex;align-items:center;gap:9px;margin:0;padding:4px 10px 6px;font-weight:700;font-size:14px}
.logo{width:18px;height:18px;font-size:18px}
.side h2{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--quiet);margin:18px 10px 6px}
.navs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.nav{display:flex;align-items:center;gap:10px;width:100%;min-height:30px;padding:0 10px;border:0;border-radius:8px;background:transparent;
  box-shadow:none;color:var(--soft);font-size:13.5px;text-align:left}
.nav:focus-visible{outline-offset:-3px}
@media (hover:hover){.nav:hover{background:var(--hover)}}
.nav[aria-pressed=true]{background:var(--sel);color:var(--text);font-weight:600}
.nav .ic{width:16px;height:16px;flex:none}
.nl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--quiet);padding:3px 7px;border-radius:999px}
.ct.hot{background:var(--boxsoft);color:var(--boxtext);box-shadow:inset 0 0 0 1px var(--box)}
.ib{margin:0}
.ib-head{display:flex;align-items:baseline;gap:8px;margin:18px 22px 6px;font-size:11.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--soft)}
.ib-head.wait{color:var(--boxtext)}
.ib-head .n{color:var(--quiet);font-weight:600}
.ib-note{margin-left:auto;font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--quiet)}
.ib>.hint,.ib>.ib-error{margin:4px 22px}
.ib-sort{display:flex;flex-wrap:wrap;gap:4px;margin:0 22px 6px}
.ib-sort button{padding:2px 10px;border-radius:999px;border-color:transparent;background:transparent;box-shadow:none;color:var(--soft);font-size:12px}
.ib-sort button[aria-pressed=true]{background:var(--sel);color:var(--text);font-weight:600}
@media (hover:hover){.ib-sort button:hover{background:var(--hover)}}
.ib-fresh{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 8px 6px;
  padding:8px 12px;border-radius:10px;border:1px solid var(--box);background:var(--boxsoft);color:var(--text);font-weight:600}
.ib-fresh button{padding:3px 12px}
.ib-search{display:flex;align-items:center;gap:8px;flex:0 1 320px;min-width:150px}
.ib-search input{flex:1;min-width:0;font:inherit;font-size:13px;padding:5px 10px;border:1px solid var(--line2);border-radius:8px;
  background:var(--field);color:var(--text);-webkit-appearance:none;appearance:none}
.ib-search input::placeholder{color:var(--quiet);opacity:1}
.ib-search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.ib-search input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.ib-search-count{font-size:12.5px;color:var(--soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.ib-search button{padding:3px 10px;font-size:12.5px}
.ib-nomatch{margin:16px 22px}
.ic-copy{margin-left:4px;padding:0 2px;font-size:11.5px;text-decoration:none}
.ic-warn,.md-warn{color:var(--boxtext);font-size:12.5px;font-weight:600}
.ic-warn{margin-left:6px}
.md .md-warn{margin:0;padding:6px 12px;border-top:1px solid var(--box);background:var(--boxsoft)}
.ib-copytext{margin:10px 0 0;padding:3px 12px;font-size:12.5px}
.ib-list{list-style:none;margin:0;padding:0 8px}
.ib-main{position:relative;display:grid;grid-template-columns:26px minmax(0,1fr) auto;grid-template-areas:"mono title when" "mono sub sub";
  gap:3px 12px;align-items:center;width:100%;padding:10px 12px;border:0;border-radius:10px;box-shadow:none;background:transparent;
  color:var(--text);text-align:left;text-decoration:none;font:inherit;cursor:pointer}
[data-density=compact] .ib-main{padding:6px 12px;gap:1px 10px}
[data-density=compact] body.inbox{font-size:13px}
.ib-main:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
@media (hover:hover){.ib-main:hover{background:var(--hover)}}
.ib-row.on>.ib-main{background:var(--sel)}
.ib-row.on>.ib-main::before{content:"";position:absolute;left:-6px;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--accent)}
.mono{grid-area:mono;align-self:start;margin-top:1px;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;
  font:700 10.5px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;box-shadow:inset 0 0 0 1px var(--glassline)}
.mono.lg{width:34px;height:34px;border-radius:9px;font-size:12.5px;margin:0}
.mono.sm{width:20px;height:20px;border-radius:6px;font-size:9px;margin:0;align-self:center}
.mono:empty{visibility:hidden}.mono.c0{background:var(--m0bg);color:var(--m0fg)}.mono.c1{background:var(--m1bg);color:var(--m1fg)}
.mono.c2{background:var(--m2bg);color:var(--m2fg)}.mono.c3{background:var(--m3bg);color:var(--m3fg)}
.mono.c4{background:var(--m4bg);color:var(--m4fg)}.mono.c5{background:var(--m5bg);color:var(--m5fg)}
.ib-title{grid-area:title;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib.idle .ib-title{font-weight:500;color:var(--soft)}
.ib-when{grid-area:when;font-size:12px;color:var(--quiet);font-variant-numeric:tabular-nums;white-space:nowrap}
.ib-sub{grid-area:sub;display:flex;gap:6px;align-items:center;min-width:0;overflow:hidden;white-space:nowrap;font-size:12.5px;color:var(--quiet)}
.ib-sub .ib-name{color:var(--soft);margin-right:2px}
.ib-text{overflow:hidden;text-overflow:ellipsis}
.ib-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib-kind{font-size:12px;font-weight:600;white-space:nowrap}
.ib-glyph{font-size:10px}
.k-q{color:var(--accent)}.k-w{color:var(--boxtext)}.k-t{color:var(--quiet)}.k-t.ib-kind{font-weight:500}.k-ok{color:var(--ok)}
.state{display:inline-block;font-size:11.5px;font-weight:650;border-radius:999px;padding:2px 8px;background:var(--hover);color:var(--soft)}
.state.working{background:var(--oksoft);color:var(--ok)}
#ib-detail{overflow:auto;padding:22px 28px 40px;min-height:0;min-width:0;overscroll-behavior:contain}
body.focusing #ib-detail{padding:18px max(28px,calc(50% - 400px)) 40px}
.ib-empty{margin:40px 0;text-align:center;color:var(--quiet)}
.dv{max-width:760px}
.dh{display:flex;gap:14px;align-items:flex-start;margin:0 0 16px}
.dhm{min-width:0;flex:1}
.dhp{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0;font-size:12.5px;color:var(--quiet)}
.dhp .ib-name{color:var(--soft);font-weight:600;margin-right:4px}
.dhp .ib-when{margin-left:auto}
.dh h2{font-size:20px;line-height:1.3;margin:4px 0 0;font-weight:700;letter-spacing:-.01em}
.dh h2:focus{outline:none}
.dh h2:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.ib-body{font-size:14px;min-width:0}
.ib-hint{margin:0 0 16px;padding:10px 14px;border-radius:10px;border:1px solid var(--box);background:var(--boxsoft)}
.ib-hint strong{color:var(--boxtext);margin-right:4px}
.ib-ghead{display:flex;align-items:center;gap:8px;margin:12px 22px 2px;font-size:12.5px;font-weight:600;color:var(--soft)}
.ib-ghead .n{color:var(--quiet);font-variant-numeric:tabular-nums}
.ib-ghead.tog{margin:2px 8px}
.ib-gtoggle{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;border:0;border-radius:10px;box-shadow:none;
  background:transparent;color:var(--soft);font:inherit;font-weight:600;text-align:left;cursor:pointer}
.ib-gtoggle::after{content:"▸";font-size:15px;line-height:1;color:var(--quiet)}
.ib-group .ib-sub .ib-name{display:none}
.ib-gtoggle[aria-expanded=true]::after{content:"▾"}
.ib-gtoggle:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
@media (hover:hover){.ib-gtoggle:hover{background:var(--hover)}}
.ib-acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
.md .ib-acts a.ib-go{margin:0}
.ib-steps{font-size:13px;font-weight:600;color:var(--soft)}
.md-list li.task.wait{margin-left:-31px;padding-left:8px;border-left:3px solid var(--box)}
.ib-error{color:var(--boxtext);font-size:13px;margin:4px 0}
.md a.ib-go{display:inline-block;margin:6px 0 0;padding:7px 16px;border-radius:8px;background:var(--btn);color:var(--btntext);font-weight:600;
  text-decoration:none}
.ib-msg{margin:16px 0 14px}
.ib-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.ib-lab{display:block;font-size:12.5px;font-weight:600;color:var(--soft);margin:0 0 6px}
.ib-form{display:flex;gap:8px;align-items:center}
.ib-form input{flex:1;min-width:0;font:inherit;padding:8px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--field);color:var(--text)}
.ib-form input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.ib-msg-hint{margin:8px 0 0;font-size:12px;color:var(--quiet)}
.ib-sent{list-style:none;margin:10px 0 0;padding:0;font-size:13px}
.ib-sent li{display:flex;gap:12px;align-items:baseline;justify-content:space-between;min-width:0;padding:8px 2px;border-top:1px solid var(--line)}
.ib-sent-text{min-width:0;overflow-wrap:anywhere;color:var(--soft)}
.pill{flex:none;font-size:11.5px;font-weight:650;border-radius:999px;padding:2px 8px;background:var(--hover);color:var(--soft);white-space:nowrap}
.pill.done{background:var(--oksoft);color:var(--ok)}
.ib-msg-status{margin:6px 0 0;font-size:13px;color:var(--quiet)}
.ib-msg-status:empty{display:none}
.ib-vulns{list-style:none;margin:8px 0 0;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.ib-vuln{padding:11px 14px;min-width:0}

    doneButtons = [doneButton, done2];
    end.append(why, done2);
    sheet.append(end);
    var missing = missingRounds();
    why.hidden = !missing.length;
    why.textContent = byId('done-reason').textContent;
    done2.setAttribute('aria-disabled', String(!!missing.length));
  }
  tabs.addEventListener('click', function (e) {
    var t = e.target.closest('[role=tab]');
    if (t) showRound(tabButtons.indexOf(t));
  });
  tabs.addEventListener('keydown', function (e) {
    var i = tabButtons.indexOf(e.target), n = tabButtons.length, next = null;
    if (i < 0) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next = (i + 1) % n;
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') next = (i - 1 + n) % n;
    else if (e.key === 'Home') next = 0;
    else if (e.key === 'End') next = n - 1;
    if (next === null) return;
    e.preventDefault();
    showRound(next);
    tabButtons[next].focus();
  });

  // "Accept all" sets every item of the open round that has a recommendation to it, comments and marks untouched.
  // A second click restores the choices from before; changing any item's options afterwards ends that undo.
  acceptButton.addEventListener('click', function () {
    var ri = active, items = rounds[ri].decisions.items;
    if (undo[ri]) {
      items.forEach(function (item) {
        setChoice(ri, item, undo[ri][item.id].choice);
        sources[ri][item.id] = undo[ri][item.id].source;
      });
      undo[ri] = null;
    } else {
      undo[ri] = {};
      items.forEach(function (item) {
        undo[ri][item.id] = {source: sources[ri][item.id],
          choice: inputs(ri, item).filter(function (i) { return i.checked; }).map(function (i) { return i.value; })};
        if (hasRec(item)) {
          setChoice(ri, item, recList(item));
          sources[ri][item.id] = 'accept_all';
        }
      });
    }
    label(!!undo[ri]);
    later(ri, 150);
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset.round === undefined) return;
    var ri = Number(t.dataset.round);
    if (t.dataset.item !== undefined && (t.type === 'radio' || t.type === 'checkbox')) {
      if (t.type === 'checkbox' && t.checked) {
        // Skip stands alone: ticking it clears the other boxes, ticking another box clears it.
        document.getElementsByName(t.name).forEach(function (i) {
          if (i !== t && (t.value === SKIP || i.value === SKIP)) i.checked = false;
        });
      }
      if (mirrors[t.name]) mirrors[t.name]();
      sources[ri][t.dataset.item] = 'user';
      if (undo[ri]) {
        undo[ri] = null;
        label(false);
      }
    }
    later(ri, 250);
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.dataset.round === undefined || (t.tagName !== 'TEXTAREA' && t.type !== 'text')) return;
    if (t.classList.contains('other-text')) {
      var pick = byId(t.dataset.pick);
      if (!pick.checked) {
        pick.checked = true;
        pick.dispatchEvent(new Event('change', {bubbles: true}));
      }
    }
    later(Number(t.dataset.round), 800);
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden' && Object.keys(dirty).length && !finished) save(true);
  });

  // One Done for every editable round: save them all first, so a bad one stops before any round is final.
  function each(list, done) {
    return list.reduce(function (p, ri) {
      return p.then(function (ok) { return !ok ? false : (closed[ri] ? true : send(ri, done)); });
    }, Promise.resolve(true));
  }
  function finish() {
    if (finished) return;
    if (wizard && missingRounds().length) {  // Done is not ready: say why and go there
      status.textContent = byId('done-reason').textContent;
      byId('done-reason').focus();
      return;
    }
    doneButtons.forEach(function (b) { b.disabled = true; });
    clearTimeout(timer);
    dirty = {};
    chain = chain.then(function () { return each(editable, false); })
      .then(function (ok) { return ok && each(editable, true); });
    chain.then(function (ok) {
      if (!ok) { doneButtons.forEach(function (b) { b.disabled = false; }); return; }
      finished = true;
      acceptButton.disabled = true;
      Array.prototype.forEach.call(document.querySelectorAll('main input, main textarea, .mark-tools button, .mark-row button'), function (i) { i.disabled = true; });
      status.textContent = L.done;
      var banner = byId('banner');
      banner.textContent = data.orphan ? L.doneOrphan : L.doneBanner;
      banner.classList.add('on');
      mainEl.scrollTop = 0;
    });
  }
  doneButton.addEventListener('click', finish);

  // Keyboard shortcuts. They never act while a text field has focus or a modifier key is held, so typing,
  // browser shortcuts and screen reader commands keep working.
  var help = byId('help');
  [[['1–9'], L.kPick], [['j', 'k'], L.kMove], [['↑', '↓'], L.kTabs], [['←', '↑', '→', '↓'], L.kMark],
    [['Ctrl', 'Enter'], L.kAccept], [['f'], L.kFocus], [shortcut, L.kTheme], [['?'], L.kHelp],
    [['Esc'], L.kLeave]].forEach(function (row) {
    if (historyMode && (row[1] === L.kAccept || row[1] === L.kFocus)) return;  // read only, and no Focus
    var dt = el('dt');
    row[0].forEach(function (k, i) {
      if (i) dt.append(' ');
      dt.append(el('kbd', '', k));
    });
    help.querySelector('#help-keys').append(dt, el('dd', '', row[1]));
  });
  function openHelp() { if (!help.open) help.showModal(); }
  sh.keysButton.addEventListener('click', openHelp);
  byId('help-close').addEventListener('click', function () { help.close(); });
  function typing(t) {
    return !!t && (t.isContentEditable || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT'
      || (t.tagName === 'INPUT' && t.type !== 'radio' && t.type !== 'checkbox'));
  }
  function shown(list) {  // the first enabled input on screen: in the table view the cards' inputs are hidden
    return Array.prototype.filter.call(list, function (i) { return !i.disabled && i.offsetParent !== null; })[0];
  }
  function focusItem(card) {
    var target = shown(card.querySelectorAll('.choices input:checked, .cmp input:checked')) || shown(card.querySelectorAll('input')) || card;
    target.focus();
    card.scrollIntoView({block: 'nearest'});
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !e.altKey && !historyMode && !typing(e.target) && !help.open
        && !picker.open && !sh.has('side-open')) {
      e.preventDefault();
      if (!wizard) finish();
      else if (active !== SUMMARY) acceptRound(active);
      else finish();
      return;
    }
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey || help.open || picker.open) return;
    if (e.key === 'Escape') {  // also from a text box: leaving Focus keeps what was typed
      if (sh.has('side-open')) sh.closeSide(true);
      else if (sh.has('focusing')) setFocus(false);
      else return;
      e.preventDefault();
      return;
    }
    if (typing(e.target)) return;
    if (e.key === '?') {
      e.preventDefault();
      openHelp();
      return;
    }
    if ((e.key === 'f' || e.key === 'F') && !historyMode) {
      e.preventDefault();
      setFocus(!sh.has('focusing'));
      return;
    }
    var panel = byId('panel-' + active);
    if (!panel) return;
    var cards = Array.prototype.slice.call(panel.querySelectorAll('.item[data-item]'));
    var current = e.target.closest ? e.target.closest('.item[data-item]') : null;
    var at = sh.has('focusing') ? cur[active] : cards.indexOf(current);  // in Focus, the item shown
    if (e.key === 'j' || e.key === 'k') {
      var next = at < 0 ? 0 : at + (e.key === 'j' ? 1 : -1);
      if (next >= 0 && next < cards.length) {
        e.preventDefault();
        goItem(next);
      }
      return;
    }
    if (/^[1-9]$/.test(e.key) && current) {
      var input = current.querySelectorAll('.choices input[type=radio], .choices input[type=checkbox]')[Number(e.key) - 1];
      if (!input || input.disabled) return;
      e.preventDefault();
      input.checked = input.type === 'radio' ? true : !input.checked;
      (input.offsetParent === null && byId(input.id.replace(/-o(\d+)$/, '-x$1')) || input).focus();
      input.dispatchEvent(new Event('change', {bubbles: true}));
    }
  });

  if (!historyMode) {
    // #focus=<round>/<item> (from the inbox's start link for a notification): that round's item in Focus. A hash
    // that names no round and item on this page is ignored.
    var asked = /^#focus=(\d{1,4})\/([A-Za-z0-9][A-Za-z0-9_.-]{0,63})$/.exec(location.hash);
    var askedRound = asked && rounds[Number(asked[1])];
    var askedItem = askedRound && askedRound.decisions ? askedRound.decisions.items.map(function (it) { return it.id; })
      .indexOf(asked[2]) : -1;
    if (askedItem >= 0) {
      active = Number(asked[1]);
      cur[active] = askedItem;  // before showRound, so the sidebar's outline marks it too
    }
    showRound(active);
    refresh();
    if (askedItem >= 0) {
      setFocus(true);
    } else if (window.matchMedia('(max-width: 760px)').matches) {
      // A phone opens in Focus, one item at a time; only at load, so turning the phone never switches it.
      setFocus(true, true);
    }
  }
})();
</script>
</body>
</html>
